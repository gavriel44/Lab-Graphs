[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labgraphs"
version = "0.1.0"
description = "Curve fitting and residual plots for laboratory measurements with uncertainties."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gavriel Frant"}]
keywords = ["physics", "laboratory", "curve-fitting", "uncertainty", "odr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "odrpack>=0.6,<0.7"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/gavriel44/Lab-Graphs"
Issues = "https://github.com/gavriel44/Lab-Graphs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labgraphs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["labgraphs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
