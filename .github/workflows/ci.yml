name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[plot,excel,dev]"
      - run: python -m pytest --cov=labgraphs --cov-report=term-missing
      - run: python examples/ohms_law.py
      - run: python examples/custom_model.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/labgraphs-wheel
          /tmp/labgraphs-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/labgraphs-wheel/bin/python -c 'from labgraphs import Dataset, fit, models; r = fit(Dataset([0, 1, 2, 3], [1, 3.1, 4.9, 7], sy=0.1), models.linear); assert abs(r.parameter_values["slope"] - 2) < 0.1'
